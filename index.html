<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ks-metics — Armá tu pedido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a2620;
    --bg:#faf6f3;
    --paper:#ffffff;
    --rose:#dd9aa4;
    --rose-deep:#c97686;
    --mint:#a7c4b3;
    --mint-deep:#84a893;
    --line:#e7ded7;
    --muted:#8c8178;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:100px;
  }
  header{
    padding:44px 24px 28px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 15% 20%, rgba(221,154,164,.14), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(167,196,179,.16), transparent 45%);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--rose-deep);
    font-weight:700;
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 8px;
    letter-spacing:-.01em;
  }
  header p{
    color:var(--muted);
    font-size:15px;
    max-width:440px;
    margin:0 auto;
    line-height:1.5;
  }

  .catalog{
    max-width:920px;
    margin:36px auto;
    padding:0 20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:16px;
  }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 24px -14px rgba(42,38,32,.25);
  }
  .swatch{
    height:92px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    overflow:hidden;
    background:#ffffff;
  }
  .swatch img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .swatch.has-image{background:#ffffff !important;}
  .cat-limpiador{background:linear-gradient(135deg,#f3e0e2,#e8c7cc);}
  .cat-tonico{background:linear-gradient(135deg,#e2ede6,#c9dccf);}
  .cat-serum{background:linear-gradient(135deg,#efe6d8,#e2d3b8);}
  .cat-crema{background:linear-gradient(135deg,#e7e0f0,#d3c5e6);}
  .cat-protector{background:linear-gradient(135deg,#fdf1cf,#f6dfa0);}
  .cat-mascarilla{background:linear-gradient(135deg,#f6dfe8,#eec2d6);}
  .cat-exfoliante{background:linear-gradient(135deg,#ecebd8,#dcd8ae);}
  .cat-ojos{background:linear-gradient(135deg,#dde7ef,#bfd3e3);}
  .cat-otros{background:linear-gradient(135deg,#eee9e4,#ddd4ca);}

  .state-msg{
    grid-column:1/-1;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:40px 20px;
  }

  .card .brand{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }
  .card .name{
    font-family:'Fraunces',serif;
    font-size:16.5px;
    font-weight:600;
    line-height:1.25;
  }
  .card .price{
    font-size:14.5px;
    font-weight:700;
    color:var(--rose-deep);
  }
  .qty-row{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .stepper{
    display:flex;
    align-items:center;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .stepper button{
    width:30px;height:30px;
    border:none;
    background:var(--bg);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
  }
  .stepper button:hover{background:var(--line);}
  .stepper span{
    width:28px;
    text-align:center;
    font-weight:700;
    font-size:14px;
  }
  .add-btn{
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.02em;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .add-btn:hover{background:var(--rose-deep);}
  .add-btn.added{background:var(--mint-deep);}

  /* Bandeja de pedido — estilo recibo */
  .tray-toggle{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    z-index:20;
  }
  .tray-toggle .count{
    background:var(--rose);
    color:var(--ink);
    border-radius:999px;
    padding:2px 9px;
    font-size:12.5px;
    margin-right:8px;
  }
  .tray{
    position:fixed;
    bottom:0;left:0;right:0;
    max-height:78vh;
    background:var(--paper);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -18px 40px -20px rgba(42,38,32,.35);
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    z-index:30;
    display:flex;
    flex-direction:column;
  }
  .tray.open{transform:translateY(0);}
  .tray-header{
    padding:18px 20px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px dashed var(--line);
  }
  .tray-header h2{
    font-family:'Fraunces',serif;
    font-size:19px;
    margin:0;
  }
  .tray-header button{
    border:none;background:none;
    font-size:20px;
    color:var(--muted);
    cursor:pointer;
  }
  .tray-items{
    overflow-y:auto;
    padding:6px 20px;
    flex:1;
  }
  .tray-empty{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    padding:30px 0;
  }
  .tray-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
    gap:10px;
  }
  .tray-item .info .name{font-size:14.5px;font-weight:700;}
  .tray-item .info .sub{font-size:12.5px;color:var(--muted);}
  .tray-item .remove{
    border:none;background:none;color:var(--muted);
    font-size:13px;text-decoration:underline;cursor:pointer;
  }
  .tray-footer{
    padding:16px 20px 22px;
    border-top:1px solid var(--line);
    background:var(--paper);
  }
  .total-row{
    display:flex;justify-content:space-between;
    font-size:16px;font-weight:800;
    margin-bottom:14px;
  }
  .wa-field{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .wa-field input{
    flex:1;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 11px;
    font-size:13.5px;
    font-family:'Manrope',sans-serif;
  }
  .actions{
    display:flex;
    gap:10px;
  }
  .actions button{
    flex:1;
    border:none;
    padding:13px 10px;
    border-radius:12px;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
  }
  .btn-copy{
    background:var(--ink);
    color:#fff;
  }
  .btn-copy.copied{background:var(--mint-deep);}
  .btn-wa{
    background:var(--rose);
    color:var(--ink);
  }
  .hint{
    font-size:11.5px;
    color:var(--muted);
    margin-top:10px;
    text-align:center;
  }
  .name{cursor:pointer;}
  .swatch{cursor:pointer;}

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(42,38,32,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--paper);
    border-radius:20px;
    max-width:360px;
    width:100%;
    padding:24px;
    position:relative;
    box-shadow:0 30px 60px -20px rgba(42,38,32,.4);
  }
  .modal-close{
    position:absolute;
    top:14px;right:14px;
    border:none;background:none;
    font-size:18px;color:var(--muted);
    cursor:pointer;
  }
  .modal-swatch{
    height:130px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:52px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .modal-swatch img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .modal-swatch.has-image{background:#ffffff !important;}
  .modal-swatch.has-image{cursor:zoom-in;}

  .zoom-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,18,15,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:80;
    touch-action:none;
    overflow:hidden;
  }
  .zoom-overlay.open{display:flex;}
  .zoom-overlay img{
    max-width:92vw;
    max-height:88vh;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
    transition:transform .08s ease-out;
    will-change:transform;
    background:#fff;
    border-radius:6px;
  }
  .zoom-close{
    position:absolute;
    top:18px;right:18px;
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.92);
    color:var(--ink);
    font-size:18px;
    cursor:pointer;
    z-index:2;
  }
  .zoom-hint{
    position:absolute;
    bottom:18px;left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:12.5px;
    opacity:.75;
    background:rgba(0,0,0,.3);
    padding:6px 14px;
    border-radius:999px;
    pointer-events:none;
  }
  .modal-name{
    font-family:'Fraunces',serif;
    font-size:21px;
    font-weight:600;
    margin:4px 0 6px;
  }
  .modal-desc{
    font-size:14px;
    line-height:1.55;
    color:var(--muted);
    margin:10px 0 16px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">✨ Skincare coreano original, directo desde Corea 🇰🇷</div>
  <h1>Ks-metics</h1>
  <p>Elegí tus productos y cantidades. Al final tocás un botón y el pedido queda listo para enviar por WhatsApp.</p>
</header>

<div class="catalog" id="catalog"></div>

<button class="tray-toggle" id="trayToggle">
  <span><span class="count" id="trayCount">0</span>productos seleccionados</span>
  <span id="trayTotal">Ver pedido →</span>
</button>

<div class="tray" id="tray">
  <div class="tray-header">
    <h2>Tu pedido</h2>
    <button id="trayClose">✕</button>
  </div>
  <div class="tray-items" id="trayItems">
    <div class="tray-empty">Todavía no agregaste productos.</div>
  </div>
  <div class="tray-footer">
    <div class="total-row"><span>Total</span><span id="totalPrice">$0</span></div>
    <div class="actions">
      <button class="btn-copy" id="copyBtn">Copiar pedido</button>
      <button class="btn-wa" id="waBtn">Enviar por WhatsApp</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-swatch" id="modalSwatch"></div>
    <div class="brand" id="modalBrand"></div>
    <div class="modal-name" id="modalName"></div>
    <div class="price" id="modalPrice"></div>
    <p class="modal-desc" id="modalDesc"></p>
    <div class="qty-row">
      <div class="stepper">
        <button id="modalMinus">−</button>
        <span id="modalQty">0</span>
        <button id="modalPlus">+</button>
      </div>
      <button class="add-btn" id="modalAdd">Agregar</button>
    </div>
  </div>
</div>

<div class="zoom-overlay" id="zoomOverlay">
  <button class="zoom-close" id="zoomClose">✕</button>
  <img id="zoomImg" src="" alt="">
  <div class="zoom-hint">Doble toque o rueda del mouse para hacer zoom · arrastra para mover</div>
</div>

<script>
// ------ Productos: se cargan en vivo desde Notion vía /api/products ------
const WHATSAPP_NUMBER = "584129058435";

const CATEGORY_META = {
  "limpiador": { emoji: "🌾", cls: "cat-limpiador" },
  "tónico": { emoji: "🌿", cls: "cat-tonico" },
  "tonico": { emoji: "🌿", cls: "cat-tonico" },
  "serum": { emoji: "✨", cls: "cat-serum" },
  "crema": { emoji: "🐌", cls: "cat-crema" },
  "protector solar": { emoji: "☀️", cls: "cat-protector" },
  "mascarilla": { emoji: "🎭", cls: "cat-mascarilla" },
  "exfoliante": { emoji: "🧴", cls: "cat-exfoliante" },
  "contorno de ojos": { emoji: "👁️", cls: "cat-ojos" },
};
function metaFor(cat){
  return CATEGORY_META[cat] || { emoji: "🧪", cls: "cat-otros" };
}

let PRODUCTS = [];
const state = {}; // id -> qty
const catalogEl = document.getElementById('catalog');

async function loadProducts(){
  catalogEl.innerHTML = `<div class="state-msg">Cargando productos desde Notion…</div>`;
  try{
    const res = await fetch('/api/products');
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    PRODUCTS = data.map(p => ({...p, ...metaFor(p.cat)}));
    if(PRODUCTS.length === 0){
      catalogEl.innerHTML = `<div class="state-msg">No hay productos disponibles por ahora.</div>`;
      return;
    }
    render();
  }catch(err){
    catalogEl.innerHTML = `<div class="state-msg">No se pudieron cargar los productos. Intenta recargar la página.</div>`;
  }
}

function render(){
  catalogEl.innerHTML = PRODUCTS.map(p => `
    <div class="card">
      <div class="swatch ${p.cls}${p.image ? ' has-image' : ''}" onclick="openModal('${p.id}')">${p.image ? `<img src="${p.image}" alt="${p.name}">` : p.emoji}</div>
      <div class="brand">${p.brand}</div>
      <div class="name" onclick="openModal('${p.id}')">${p.name}</div>
      <div class="price">$${p.price.toFixed(2)}</div>
      <div class="qty-row">
        <div class="stepper">
          <button onclick="changeQty('${p.id}', -1)">−</button>
          <span id="qty-${p.id}">${state[p.id] || 0}</span>
          <button onclick="changeQty('${p.id}', 1)">+</button>
        </div>
        <button class="add-btn" id="add-${p.id}" onclick="addToOrder('${p.id}')">Agregar</button>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta){
  const current = state[id] || 0;
  const next = Math.max(0, current + delta);
  state[id] = next;
  document.getElementById(`qty-${id}`).textContent = next;
}

function addToOrder(id){
  const qty = state[id] || 0;
  if(qty === 0){ changeQty(id, 1); }
  const btn = document.getElementById(`add-${id}`);
  btn.textContent = "Agregado ✓";
  btn.classList.add('added');
  setTimeout(() => { btn.textContent = "Agregar"; btn.classList.remove('added'); }, 900);
  updateTray();
}

function getOrderItems(){
  return PRODUCTS.filter(p => (state[p.id]||0) > 0).map(p => ({...p, qty: state[p.id]}));
}

function updateTray(){
  const items = getOrderItems();
  document.getElementById('trayCount').textContent = items.reduce((s,i)=>s+i.qty,0);
  const total = items.reduce((s,i)=>s+i.qty*i.price,0);
  document.getElementById('trayTotal').textContent = items.length ? `$${total.toFixed(2)} →` : "Ver pedido →";
  document.getElementById('totalPrice').textContent = `$${total.toFixed(2)}`;

  const itemsEl = document.getElementById('trayItems');
  if(items.length === 0){
    itemsEl.innerHTML = `<div class="tray-empty">Todavía no agregaste productos.</div>`;
    return;
  }
  itemsEl.innerHTML = items.map(i => `
    <div class="tray-item">
      <div class="info">
        <div class="name">${i.name} ×${i.qty}</div>
        <div class="sub">${i.brand} · $${(i.price*i.qty).toFixed(2)}</div>
      </div>
      <button class="remove" onclick="removeItem(${i.id})">Quitar</button>
    </div>
  `).join('');
}

function removeItem(id){
  state[id] = 0;
  document.getElementById(`qty-${id}`).textContent = 0;
  updateTray();
}

function buildOrderText(){
  const items = getOrderItems();
  const total = items.reduce((s,i)=>s+i.qty*i.price,0);
  let text = "🛍️ *Pedido*\n\n";
  items.forEach(i => {
    text += `• ${i.name} (${i.brand}) x${i.qty} — $${(i.price*i.qty).toFixed(2)}\n`;
  });
  text += `\n*Total: $${total.toFixed(2)}*`;
  return text;
}

// Modal de detalle
let modalProductId = null;
const modalOverlay = document.getElementById('modalOverlay');

function openModal(id){
  modalProductId = id;
  const p = PRODUCTS.find(x => x.id === id);
  document.getElementById('modalSwatch').className = `modal-swatch ${p.cls}${p.image ? ' has-image' : ''}`;
  document.getElementById('modalSwatch').innerHTML = p.image ? `<img src="${p.image}" alt="${p.name}">` : p.emoji;
  document.getElementById('modalSwatch').onclick = p.image ? () => openZoom(p.image, p.name) : null;
  document.getElementById('modalBrand').textContent = p.brand;
  document.getElementById('modalName').textContent = p.name;
  document.getElementById('modalPrice').textContent = `$${p.price.toFixed(2)}`;
  document.getElementById('modalDesc').textContent = p.desc;
  document.getElementById('modalQty').textContent = state[id] || 0;
  modalOverlay.classList.add('open');
}
document.getElementById('modalClose').onclick = () => modalOverlay.classList.remove('open');
modalOverlay.onclick = (e) => { if(e.target === modalOverlay) modalOverlay.classList.remove('open'); };

document.getElementById('modalMinus').onclick = () => {
  changeQty(modalProductId, -1);
  document.getElementById('modalQty').textContent = state[modalProductId] || 0;
};
document.getElementById('modalPlus').onclick = () => {
  changeQty(modalProductId, 1);
  document.getElementById('modalQty').textContent = state[modalProductId] || 0;
};
document.getElementById('modalAdd').onclick = () => {
  addToOrder(modalProductId);
  document.getElementById('modalQty').textContent = state[modalProductId] || 0;
};

// Bandeja
const tray = document.getElementById('tray');
document.getElementById('trayToggle').onclick = () => { tray.classList.add('open'); };
document.getElementById('trayClose').onclick = () => { tray.classList.remove('open'); };

// Copiar
document.getElementById('copyBtn').onclick = async () => {
  const items = getOrderItems();
  if(items.length === 0) return;
  const text = buildOrderText();
  const btn = document.getElementById('copyBtn');
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  btn.textContent = "¡Copiado! ✓";
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = "Copiar pedido"; btn.classList.remove('copied'); }, 1400);
};

// Enviar por WhatsApp
document.getElementById('waBtn').onclick = () => {
  const items = getOrderItems();
  if(items.length === 0) return;
  const text = buildOrderText();
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
};

// ---- Visor de zoom (estilo Mercado Libre) ----
const zoomOverlay = document.getElementById('zoomOverlay');
const zoomImg = document.getElementById('zoomImg');
let zScale = 1, zX = 0, zY = 0;
let dragging = false, dragStartX = 0, dragStartY = 0, startX = 0, startY = 0;
let pinchStartDist = 0, pinchStartScale = 1;

function applyZoomTransform(){
  zoomImg.style.transform = `translate(${zX}px, ${zY}px) scale(${zScale})`;
  zoomImg.style.cursor = zScale > 1 ? 'grab' : 'zoom-in';
}

function openZoom(src, alt){
  zoomImg.src = src;
  zoomImg.alt = alt || '';
  zScale = 1; zX = 0; zY = 0;
  applyZoomTransform();
  zoomOverlay.classList.add('open');
}
function closeZoom(){
  zoomOverlay.classList.remove('open');
}
document.getElementById('zoomClose').onclick = closeZoom;
zoomOverlay.addEventListener('click', (e) => { if(e.target === zoomOverlay) closeZoom(); });

// Doble click / doble toque para alternar zoom
zoomImg.addEventListener('dblclick', (e) => {
  if(zScale === 1){ zScale = 2.5; }
  else { zScale = 1; zX = 0; zY = 0; }
  applyZoomTransform();
});

// Rueda del mouse (desktop)
zoomImg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.25 : -0.25;
  zScale = Math.min(4, Math.max(1, zScale + delta));
  if(zScale === 1){ zX = 0; zY = 0; }
  applyZoomTransform();
}, { passive:false });

// Arrastrar para mover cuando hay zoom (mouse)
zoomImg.addEventListener('mousedown', (e) => {
  if(zScale === 1) return;
  dragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  startX = zX; startY = zY;
});
window.addEventListener('mousemove', (e) => {
  if(!dragging) return;
  zX = startX + (e.clientX - dragStartX);
  zY = startY + (e.clientY - dragStartY);
  applyZoomTransform();
});
window.addEventListener('mouseup', () => { dragging = false; });

// Táctil: pellizcar para zoom + arrastrar
zoomImg.addEventListener('touchstart', (e) => {
  if(e.touches.length === 2){
    pinchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    pinchStartScale = zScale;
  } else if(e.touches.length === 1 && zScale > 1){
    dragging = true;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    startX = zX; startY = zY;
  }
}, { passive:true });

zoomImg.addEventListener('touchmove', (e) => {
  if(e.touches.length === 2){
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    zScale = Math.min(4, Math.max(1, pinchStartScale * (dist / pinchStartDist)));
    applyZoomTransform();
  } else if(dragging && e.touches.length === 1){
    zX = startX + (e.touches[0].clientX - dragStartX);
    zY = startY + (e.touches[0].clientY - dragStartY);
    applyZoomTransform();
  }
}, { passive:true });

zoomImg.addEventListener('touchend', (e) => {
  if(e.touches.length === 0){ dragging = false; }
  if(zScale <= 1){ zScale = 1; zX = 0; zY = 0; applyZoomTransform(); }
});

loadProducts();
updateTray();
</script>
